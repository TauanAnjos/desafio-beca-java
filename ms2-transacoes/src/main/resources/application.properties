spring.application.name=ms2-transacoes
server.port=8082

spring.datasource.url=jdbc:postgresql://localhost:${TRANSACTION_DB_PORT:5435}/${TRANSACTION_DB_NAME}
spring.datasource.username=${TRANSACTION_DB_USER}
spring.datasource.password=${TRANSACTION_DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

mockapi.base-url=${MOCK_API_BASE_URL}

users-service.base-url=${USERS_SERVICE_URL:http://localhost:8081}